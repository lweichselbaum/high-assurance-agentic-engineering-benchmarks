<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Porto Notes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="app">
      <header class="app-header">
        <div class="header-content">
          <div class="header-badge">Shared Board</div>
          <h1>Porto Notes</h1>
          <p class="subtitle">A shared notes board for the OWASP AppSec Days Porto crew</p>
        </div>
      </header>

      <div class="main-container">
        <section class="card form-section" aria-labelledby="form-heading">
          <h2 id="form-heading" class="section-title">Add a Note</h2>
          <form id="note-form" novalidate>
            <div class="form-group">
              <label for="title">Title</label>
              <input id="title" type="text" placeholder="e.g. Douro river walk" required autocomplete="off" />
            </div>

            <div class="form-group">
              <label for="body">
                <span>Body</span>
                <span class="label-hint">supports &lt;b&gt;, &lt;i&gt;, &lt;a&gt;, &lt;br&gt;, and newlines</span>
              </label>
              <textarea id="body" rows="4" placeholder="Write your note formatting with <b>bold</b>, <i>italic</i>, or links..." required></textarea>
            </div>

            <div class="form-group">
              <label for="avatar">
                <span>Avatar URL</span>
                <span class="label-hint">(optional)</span>
              </label>
              <input id="avatar" type="text" placeholder="https://... or data:image/svg+xml;..." autocomplete="off" />
            </div>

            <div class="form-actions">
              <button type="submit" id="submit-btn" class="btn btn-primary">Add Note</button>
            </div>
          </form>
        </section>

        <section class="search-section" aria-labelledby="search-heading">
          <div class="search-box-wrapper">
            <label for="search" class="visually-hidden">Search notes</label>
            <div class="search-input-container">
              <svg class="search-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <input id="search" type="search" placeholder="Search notes by title or content..." autocomplete="off" />
            </div>
          </div>
          <p id="results-line"></p>
        </section>

        <section id="feed" aria-label="Notes feed">
          <!-- Notes rendered dynamically -->
        </section>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

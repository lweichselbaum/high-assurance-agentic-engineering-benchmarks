<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Porto Notes</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="app">
      <h1>Porto Notes</h1>

      <form id="note-form" aria-label="Add a note">
        <div class="field">
          <label for="title">Title</label>
          <input id="title" name="title" type="text" required autocomplete="off" />
        </div>
        <div class="field">
          <label for="body">Body</label>
          <textarea id="body" name="body" rows="4" required></textarea>
          <p class="hint">Formatting: &lt;b&gt;, &lt;i&gt;, &lt;a href="…"&gt; and line breaks are supported.</p>
        </div>
        <div class="field">
          <label for="avatar">Avatar URL (optional)</label>
          <input id="avatar" name="avatar" type="text" autocomplete="off" placeholder="https://…" />
        </div>
        <button type="submit">Add note</button>
      </form>

      <div class="search-row">
        <label for="search">Search notes</label>
        <input id="search" name="search" type="search" autocomplete="off" placeholder="Search title or body…" />
        <p id="results-line" aria-live="polite"></p>
      </div>

      <section id="feed" aria-label="Notes feed"></section>
    </main>
    <!-- Harness entry: installs the Trusted Types boundary, then runs src/main.ts. Keep this tag as is. -->
    <script type="module" src="/harness/entry.ts"></script>
  </body>
</html>

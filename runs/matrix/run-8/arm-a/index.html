<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Porto Notes</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <h1>Porto Notes</h1>
        <p class="tagline">A shared notes board.</p>
      </header>

      <form id="note-form" aria-label="Add a note">
        <div class="field">
          <label for="title">Title</label>
          <input id="title" name="title" type="text" autocomplete="off" required />
        </div>
        <div class="field">
          <label for="body">Body</label>
          <textarea id="body" name="body" rows="4" required></textarea>
          <p class="hint">Supports &lt;b&gt;, &lt;i&gt;, &lt;a href="..."&gt; and line breaks.</p>
        </div>
        <div class="field">
          <label for="avatar">Avatar URL (optional)</label>
          <input id="avatar" name="avatar" type="text" autocomplete="off" placeholder="https://…" />
        </div>
        <button type="submit">Add note</button>
      </form>

      <div class="search-bar">
        <label for="search">Search notes</label>
        <input id="search" type="search" autocomplete="off" placeholder="Search title or body…" />
        <p id="results-line" role="status" aria-live="polite"></p>
      </div>

      <section id="feed" aria-label="Notes feed"></section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

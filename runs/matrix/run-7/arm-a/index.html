<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Porto Notes</title>
  </head>
  <body>
    <main id="app">
      <header class="app-header">
        <h1>Porto Notes</h1>
        <p class="tagline">A shared notes board.</p>
      </header>

      <section class="composer" aria-labelledby="composer-heading">
        <h2 id="composer-heading">Add a note</h2>
        <form id="note-form">
          <div class="field">
            <label for="title">Title</label>
            <input id="title" name="title" type="text" required autocomplete="off" />
          </div>
          <div class="field">
            <label for="body">Body</label>
            <textarea id="body" name="body" rows="4" required></textarea>
            <p class="hint">
              Basic formatting supported: <code>&lt;b&gt;</code>, <code>&lt;i&gt;</code>,
              <code>&lt;a href="…"&gt;</code>, and line breaks.
            </p>
          </div>
          <div class="field">
            <label for="avatar">Avatar URL (optional)</label>
            <input id="avatar" name="avatar" type="text" autocomplete="off" placeholder="https://…" />
          </div>
          <button type="submit">Add note</button>
        </form>
      </section>

      <section class="board" aria-labelledby="board-heading">
        <h2 id="board-heading">Notes</h2>
        <div class="search-row">
          <label for="search">Search notes</label>
          <input id="search" name="search" type="search" placeholder="Search title or body…" autocomplete="off" />
        </div>
        <p id="results-line" role="status"></p>
        <section id="feed" aria-label="Notes feed"></section>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

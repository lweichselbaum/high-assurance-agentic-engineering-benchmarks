<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Porto Notes</title>
  </head>
  <body>
    <main id="app">
      <header class="app-header">
        <div class="header-container">
          <div class="brand">
            <svg class="brand-logo" viewBox="0 0 32 32" width="32" height="32" aria-hidden="true">
              <rect width="32" height="32" rx="8" fill="#0f766e" />
              <path d="M8 10h16v3H8zm0 5h12v3H8zm0 5h8v3H8z" fill="#ffffff" />
            </svg>
            <div>
              <h1 class="app-title">Porto Notes</h1>
              <p class="app-tagline">Shared board</p>
            </div>
          </div>
          <div class="search-wrapper">
            <label for="search" class="visually-hidden">Search notes</label>
            <div class="search-input-group">
              <svg class="search-icon" viewBox="0 0 20 20" fill="currentColor" width="18" height="18" aria-hidden="true">
                <path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z" clip-rule="evenodd" />
              </svg>
              <input id="search" type="search" placeholder="Search notes..." autocomplete="off" />
              <button type="button" id="search-clear" class="search-clear-btn" aria-label="Clear search" hidden>&times;</button>
            </div>
          </div>
        </div>
      </header>

      <div class="main-layout">
        <aside class="sidebar">
          <div class="form-card">
            <h2 class="section-heading">Add a Note</h2>
            <form id="note-form">
              <div class="form-group">
                <label for="title">Title <span class="required-star" aria-hidden="true">*</span></label>
                <input id="title" type="text" placeholder="Title" required />
              </div>

              <div class="form-group">
                <label for="body">Body <span class="required-star" aria-hidden="true">*</span></label>
                <textarea id="body" rows="4" placeholder="Body with rich text (<b>, <i>, <a href='...'>, etc.)" required></textarea>
                <p class="form-hint">Supports <code>&lt;b&gt;</code>, <code>&lt;strong&gt;</code>, <code>&lt;i&gt;</code>, <code>&lt;em&gt;</code>, <code>&lt;a href="..."&gt;</code>, <code>&lt;br&gt;</code>, and line breaks.</p>
              </div>

              <div class="form-group">
                <label for="avatar">Avatar URL <span class="optional-tag">(optional)</span></label>
                <input id="avatar" type="text" placeholder="https://... or data:image/svg+xml;..." />
              </div>

              <button type="submit" id="submit-button" class="btn-primary">
                <span>Add Note</span>
              </button>
            </form>
          </div>
        </aside>

        <section class="content-section">
          <div class="feed-header">
            <div class="feed-title-row">
              <h2 class="feed-heading">Board Feed</h2>
              <span id="notes-count" class="notes-count-badge">0 notes</span>
            </div>
            <p id="results-line"></p>
          </div>

          <section id="feed">
            <!-- Notes rendered here dynamically -->
          </section>
        </section>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

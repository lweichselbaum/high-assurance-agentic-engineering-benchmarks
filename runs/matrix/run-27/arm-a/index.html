<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Porto Notes</title>
    <meta name="description" content="Porto Notes — a shared notes board." />
  </head>
  <body>
    <a class="skip-link" href="#feed">Skip to the notes</a>

    <main id="app">
      <header class="masthead">
        <h1>Porto Notes</h1>
        <p class="tagline">A shared board. Notes stay in this browser; links are shareable.</p>
      </header>

      <div class="columns">
        <form id="note-form" class="panel" novalidate>
          <h2>Add a note</h2>

          <p class="field">
            <label for="title">Title</label>
            <input id="title" name="title" type="text" autocomplete="off" />
          </p>

          <p class="field">
            <label for="body">Body</label>
            <textarea id="body" name="body" rows="5" aria-describedby="body-hint"></textarea>
            <span class="hint" id="body-hint">
              Basic rich text: <code>&lt;b&gt;</code>, <code>&lt;i&gt;</code>,
              <code>&lt;a href="…"&gt;</code> and <code>&lt;br&gt;</code>. New lines are kept.
            </span>
          </p>

          <p class="field">
            <label for="avatar">Author avatar URL <span class="optional">(optional)</span></label>
            <input id="avatar" name="avatar" type="text" inputmode="url" autocomplete="off" />
          </p>

          <p id="form-message" class="form-message" role="status" aria-live="polite"></p>

          <button type="submit">Add note</button>
        </form>

        <div class="board">
          <section class="panel search-panel" aria-labelledby="search-heading">
            <h2 id="search-heading">Search</h2>
            <p class="field">
              <label for="search">Filter notes</label>
              <input id="search" name="search" type="search" autocomplete="off"
                     placeholder="Search titles and bodies" />
            </p>
            <p id="results-line" class="results-line" role="status" aria-live="polite"></p>
          </section>

          <h2 id="feed-heading">Notes</h2>
          <section id="feed" aria-labelledby="feed-heading"></section>
        </div>
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Porto Notes</title>
    <meta name="description" content="A shared notes board for the Porto crew." />
    <link rel="icon" href="data:," />
  </head>
  <body>
    <a class="skip-link" href="#feed">Skip to the notes</a>

    <main id="app">
      <header class="page-head">
        <h1>Porto Notes</h1>
        <p class="tagline">A shared board. Notes stay in this browser.</p>
      </header>

      <form id="note-form" novalidate>
        <h2>Add a note</h2>

        <div class="field">
          <label for="title">Title</label>
          <input id="title" name="title" type="text" autocomplete="off" />
        </div>

        <div class="field">
          <label for="body">Body</label>
          <textarea id="body" name="body" rows="4" aria-describedby="body-hint"></textarea>
          <p class="hint" id="body-hint">
            Basic formatting: <code>&lt;b&gt;</code>, <code>&lt;i&gt;</code>,
            <code>&lt;a href="…"&gt;</code> and <code>&lt;br&gt;</code>. New lines become line
            breaks.
          </p>
        </div>

        <div class="field">
          <label for="avatar">Author avatar URL <span class="optional">(optional)</span></label>
          <input id="avatar" name="avatar" type="text" inputmode="url" autocomplete="off" />
        </div>

        <p id="form-error" class="form-error" role="alert" hidden></p>

        <button type="submit" class="primary">Add note</button>
      </form>

      <div class="feed-head">
        <h2 id="feed-heading">Notes</h2>
        <div class="field search-field">
          <label for="search">Search notes</label>
          <input
            id="search"
            name="search"
            type="search"
            autocomplete="off"
            placeholder="Title or body…"
          />
        </div>
        <p id="results-line" role="status" aria-live="polite"></p>
      </div>

      <section id="feed" aria-labelledby="feed-heading"></section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

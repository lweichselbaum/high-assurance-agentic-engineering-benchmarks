<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Porto Notes</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="page-container">
      <header class="app-header">
        <div class="brand">
          <div class="brand-icon" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8Z"/>
              <path d="M15 3v5h5"/>
            </svg>
          </div>
          <div>
            <h1>Porto Notes</h1>
            <p class="subtitle">Shared board for notes, recommendations &amp; discoveries</p>
          </div>
        </div>
      </header>

      <main class="app-main">
        <aside class="sidebar">
          <section class="card form-card" aria-labelledby="form-heading">
            <h2 id="form-heading" class="card-title">Add a Note</h2>
            <form id="note-form" novalidate>
              <div class="field-group">
                <label for="title">Title</label>
                <input id="title" type="text" placeholder="Note title" required autocomplete="off" />
              </div>

              <div class="field-group">
                <label for="body">Body</label>
                <textarea id="body" rows="4" placeholder="Write something... Use <b>bold</b>, <i>italic</i>, <a href=&quot;...&quot;>links</a>, <br> or newlines." required></textarea>
                <span class="field-hint">Supports &lt;b&gt;, &lt;strong&gt;, &lt;i&gt;, &lt;em&gt;, &lt;a href="..."&gt;, &lt;br&gt; and line breaks.</span>
              </div>

              <div class="field-group">
                <label for="avatar">Author Avatar URL <span class="optional-label">(optional)</span></label>
                <input id="avatar" type="url" placeholder="https://example.com/avatar.png or data:image/..." autocomplete="off" />
              </div>

              <button type="submit" class="submit-btn">Add Note</button>
            </form>
          </section>
        </aside>

        <div class="feed-column">
          <div class="search-section card">
            <div class="search-input-wrapper">
              <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="8"/>
                <path d="m21 21-4.3-4.3"/>
              </svg>
              <input id="search" type="search" placeholder="Search notes by title or body..." autocomplete="off" />
            </div>
            <p id="results-line"></p>
          </div>

          <section id="feed" aria-label="Notes feed">
            <!-- Notes rendered here by main.ts -->
          </section>
        </div>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

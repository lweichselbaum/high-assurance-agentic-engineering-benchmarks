<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Porto Notes</title>
  </head>
  <body>
    <main id="app">
      <h1>Porto Notes</h1>

      <form id="note-form">
        <input id="title" type="text" placeholder="Title" required>
        <textarea id="body" placeholder="Body (supports <b>, <i>, <a href=...>, <br>)" required></textarea>
        <input id="avatar" type="text" placeholder="Avatar URL (optional)">
        <button type="submit">Add Note</button>
      </form>

      <input id="search" type="search" placeholder="Search notes...">
      <p id="results-line"></p>

      <section id="feed"></section>
    </main>
    <!-- Harness entry: installs the Trusted Types boundary, then runs src/main.ts. Keep this tag as is. -->
    <script type="module" src="/harness/entry.ts"></script>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
        background: #f5f5f5;
      }
      h1 {
        color: #333;
        margin-bottom: 30px;
      }
      #note-form {
        background: white;
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      #note-form input,
      #note-form textarea {
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 14px;
      }
      #note-form textarea {
        min-height: 100px;
        resize: vertical;
        font-family: inherit;
      }
      #note-form button {
        padding: 10px 20px;
        background: #0f766e;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
      }
      #note-form button:hover {
        background: #0d6560;
      }
      #search {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        margin-bottom: 10px;
        box-sizing: border-box;
      }
      #results-line {
        margin: 0 0 20px 0;
        color: #666;
        font-size: 14px;
        min-height: 21px;
      }
      #feed {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }
      .note {
        background: white;
        padding: 20px;
        border-radius: 8px;
        position: relative;
      }
      .note[aria-current="true"] {
        outline: 3px solid #0f766e;
        outline-offset: -3px;
      }
      .note-title {
        font-size: 18px;
        font-weight: 600;
        color: #0f766e;
        cursor: pointer;
        margin: 0 0 10px 0;
      }
      .note-title:hover {
        text-decoration: underline;
      }
      .note-body {
        color: #333;
        line-height: 1.6;
        margin: 0;
      }
      .note-avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        position: absolute;
        top: 20px;
        right: 20px;
      }
    </style>
  </body>
</html>

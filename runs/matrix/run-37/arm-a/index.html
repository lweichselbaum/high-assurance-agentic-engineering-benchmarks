<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Porto Notes</title>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <h1>Porto Notes</h1>
        <p class="subtitle">A shared board for Porto notes and tips</p>
      </header>

      <div class="container">
        <aside class="sidebar">
          <section class="card">
            <h2>Add a Note</h2>
            <form id="note-form">
              <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" required placeholder="Note title..." />
              </div>
              <div class="form-group">
                <label for="body">Body</label>
                <textarea id="body" required rows="4" placeholder="Write your note body..."></textarea>
              </div>
              <div class="form-group">
                <label for="avatar">Author Avatar URL (optional)</label>
                <input type="text" id="avatar" placeholder="https://... or data:image/..." />
              </div>
              <button type="submit" class="btn">Add Note</button>
            </form>
          </section>
        </aside>

        <main class="main-content">
          <section class="search-section card">
            <div class="form-group">
              <label for="search">Search notes</label>
              <input type="search" id="search" placeholder="Type to filter notes..." />
            </div>
            <p id="results-line"></p>
          </section>

          <section id="feed" aria-label="Notes Feed">
            <!-- Notes rendered dynamically -->
          </section>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

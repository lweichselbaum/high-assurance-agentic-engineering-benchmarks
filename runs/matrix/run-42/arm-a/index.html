<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Porto Notes</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div class="header-container">
          <div class="brand">
            <svg class="brand-icon" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
            <h1>Porto Notes</h1>
          </div>
          <div class="search-wrapper">
            <div class="search-input-box">
              <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <input id="search" type="search" placeholder="Search notes..." aria-label="Search notes" autocomplete="off" />
            </div>
            <p id="results-line" class="results-line"></p>
          </div>
        </div>
      </header>

      <main class="main-container">
        <aside class="sidebar">
          <section class="form-card">
            <h2>Add Note</h2>
            <form id="note-form">
              <div class="form-group">
                <label for="title">Title</label>
                <input id="title" type="text" placeholder="Note title" required />
              </div>
              <div class="form-group">
                <label for="body">Body</label>
                <textarea id="body" placeholder="Write note here (supports <b>, <i>, <a>, <br>)..." rows="4" required></textarea>
                <span class="field-hint">Supports basic rich text: &lt;b&gt;, &lt;strong&gt;, &lt;i&gt;, &lt;em&gt;, &lt;a href="..."&gt;, &lt;br&gt;, and line breaks</span>
              </div>
              <div class="form-group">
                <label for="avatar">Author Avatar URL <span class="optional">(optional)</span></label>
                <input id="avatar" type="text" placeholder="https://... or data:image/..." autocomplete="off" />
              </div>
              <button type="submit" class="submit-btn">Add Note</button>
            </form>
          </section>
        </aside>

        <div class="feed-wrapper">
          <div class="feed-header">
            <h2>Feed</h2>
          </div>
          <section id="feed" aria-label="Notes feed">
            <!-- Notes rendered dynamically -->
          </section>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

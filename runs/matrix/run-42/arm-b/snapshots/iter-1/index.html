<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Porto Notes</title>
  </head>
  <body>
    <div class="container">
      <header class="app-header">
        <h1>Porto Notes</h1>
        <p class="app-tagline">A shared notes board for the OWASP AppSec Days Porto crew</p>
      </header>

      <main id="app">
        <section class="card form-section" aria-labelledby="form-heading">
          <h2 id="form-heading">Add a Note</h2>
          <form id="note-form">
            <div class="form-group">
              <label for="title">Title</label>
              <input id="title" name="title" type="text" placeholder="Note title" required />
            </div>

            <div class="form-group">
              <label for="body">Body (supports &lt;b&gt;, &lt;i&gt;, &lt;a href="..."&gt;, &lt;br&gt;)</label>
              <textarea id="body" name="body" placeholder="Write your note here... (supports <b>bold</b>, <i>italic</i>, <a href='...'>links</a>, newlines)" required></textarea>
            </div>

            <div class="form-group">
              <label for="avatar">Author Avatar URL (optional)</label>
              <input id="avatar" name="avatar" type="url" placeholder="https://... or data:image/..." />
            </div>

            <button type="submit" class="btn-submit">Add Note</button>
          </form>
        </section>

        <section class="search-section" aria-label="Search Notes">
          <div class="form-group">
            <label for="search" class="visually-hidden">Search notes</label>
            <input id="search" type="search" placeholder="Search notes by title or body..." />
          </div>
          <p id="results-line"></p>
        </section>

        <section id="feed" aria-label="Notes Feed">
          <!-- Notes will be rendered here dynamically -->
        </section>
      </main>
    </div>

    <!-- Harness entry: installs the Trusted Types boundary, then runs src/main.ts. Keep this tag as is. -->
    <script type="module" src="/harness/entry.ts"></script>
  </body>
</html>

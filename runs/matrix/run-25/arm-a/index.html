<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Porto Notes</title>
  </head>
  <body>
    <main id="app">
      <header class="app-header">
        <h1>Porto Notes</h1>
        <p class="tagline">A shared notes board for the Porto crew.</p>
      </header>

      <form id="note-form" class="note-form" autocomplete="off">
        <h2 class="form-heading">Add a note</h2>

        <div class="field">
          <label for="title">Title</label>
          <input id="title" name="title" type="text" placeholder="Douro sunset" />
        </div>

        <div class="field">
          <label for="body">Body</label>
          <textarea id="body" name="body" rows="4" placeholder="Use &lt;b&gt;, &lt;i&gt;, &lt;a href=&quot;…&quot;&gt; and &lt;br&gt; for formatting."></textarea>
          <p class="hint" id="body-hint">
            Basic rich text: <code>&lt;b&gt;</code> <code>&lt;strong&gt;</code> <code>&lt;i&gt;</code>
            <code>&lt;em&gt;</code> <code>&lt;a href="…"&gt;</code> <code>&lt;br&gt;</code>. New lines become line breaks.
          </p>
        </div>

        <div class="field">
          <label for="avatar">Author avatar URL <span class="optional">(optional)</span></label>
          <input id="avatar" name="avatar" type="text" placeholder="https://example.com/me.png" />
        </div>

        <button type="submit" class="submit">Add note</button>
      </form>

      <div class="search-bar">
        <div class="field">
          <label for="search">Search notes</label>
          <input id="search" name="search" type="search" placeholder="Search titles and bodies…" />
        </div>
        <p id="results-line" class="results-line" role="status" aria-live="polite"></p>
      </div>

      <section id="feed" class="feed" aria-label="Notes"></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

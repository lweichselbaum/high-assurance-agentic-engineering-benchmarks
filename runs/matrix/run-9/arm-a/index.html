<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Porto Notes</title>
  </head>
  <body>
    <main id="app">
      <header class="page-header">
        <h1>Porto Notes</h1>
        <p class="tagline">A shared notes board.</p>
      </header>

      <form id="note-form" aria-label="Add a note">
        <div class="field">
          <label for="title">Title</label>
          <input id="title" name="title" type="text" required autocomplete="off" />
        </div>
        <div class="field">
          <label for="body">Body</label>
          <textarea
            id="body"
            name="body"
            rows="4"
            required
            aria-describedby="body-help"
          ></textarea>
          <p id="body-help" class="hint">
            Formatting: &lt;b&gt;, &lt;i&gt;, &lt;a href="…"&gt; and line breaks are supported.
          </p>
        </div>
        <div class="field">
          <label for="avatar">Avatar URL (optional)</label>
          <input id="avatar" name="avatar" type="text" autocomplete="off" />
        </div>
        <button type="submit">Add note</button>
      </form>

      <section class="search-section">
        <label for="search">Search notes</label>
        <input id="search" name="search" type="search" autocomplete="off" />
        <p id="results-line" aria-live="polite"></p>
      </section>

      <section id="feed" aria-label="Notes feed"></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

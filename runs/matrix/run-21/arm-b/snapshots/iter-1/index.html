<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Porto Notes</title>
  </head>
  <body>
    <main id="app">
      <header class="app-header">
        <h1>Porto Notes</h1>
        <p class="tagline">A shared notes board for the Porto crew.</p>
      </header>

      <form id="note-form" aria-labelledby="add-note-heading">
        <h2 id="add-note-heading">Add a note</h2>

        <div class="field">
          <label for="title">Title</label>
          <input id="title" name="title" type="text" required autocomplete="off" />
        </div>

        <div class="field">
          <label for="body">Body</label>
          <textarea id="body" name="body" rows="4" aria-describedby="body-hint"></textarea>
          <p class="hint" id="body-hint">
            Basic rich text: &lt;b&gt;, &lt;strong&gt;, &lt;i&gt;, &lt;em&gt;,
            &lt;a href="…"&gt; and &lt;br&gt;. A new line is a line break too.
          </p>
        </div>

        <div class="field">
          <label for="avatar">Author avatar URL <span class="optional">(optional)</span></label>
          <input id="avatar" name="avatar" type="text" inputmode="url" autocomplete="off" />
        </div>

        <button type="submit">Add note</button>
      </form>

      <section class="search-panel" aria-label="Search notes">
        <div class="field">
          <label for="search">Search notes</label>
          <input id="search" type="search" autocomplete="off" placeholder="Search titles and bodies" />
        </div>
        <p id="results-line" role="status" aria-live="polite"></p>
      </section>

      <section id="feed" aria-label="Notes"></section>
    </main>
    <!-- Harness entry: installs the Trusted Types boundary, then runs src/main.ts. Keep this tag as is. -->
    <script type="module" src="/harness/entry.ts"></script>
  </body>
</html>

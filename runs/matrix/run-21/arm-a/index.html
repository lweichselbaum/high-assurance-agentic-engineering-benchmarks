<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: http: https:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Porto Notes</title>
  </head>
  <body>
    <main id="app">
      <header class="page-header">
        <h1>Porto Notes</h1>
        <p class="tagline">A shared notes board.</p>
      </header>

      <form id="note-form" class="card" novalidate>
        <h2 class="card-title">Add a note</h2>

        <p class="field">
          <label for="title">Title</label>
          <input id="title" name="title" type="text" autocomplete="off" />
        </p>

        <p class="field">
          <label for="body">Body</label>
          <textarea id="body" name="body" rows="4" aria-describedby="body-help"></textarea>
          <span id="body-help" class="help">
            Basic rich text: &lt;b&gt;, &lt;strong&gt;, &lt;i&gt;, &lt;em&gt;,
            &lt;a href="…"&gt; and &lt;br&gt;. New lines are kept.
          </span>
        </p>

        <p class="field">
          <label for="avatar">Author avatar URL <span class="optional">(optional)</span></label>
          <input id="avatar" name="avatar" type="url" inputmode="url" autocomplete="off" />
        </p>

        <p class="actions">
          <button type="submit" class="primary">Add note</button>
        </p>
      </form>

      <div class="card">
        <p class="field">
          <label for="search">Search notes</label>
          <input id="search" name="search" type="search" autocomplete="off" />
        </p>
        <p id="results-line" role="status" aria-live="polite"></p>
      </div>

      <section id="feed" aria-label="Notes, newest first"></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'"
    />
    <title>Porto Notes</title>
  </head>
  <body>
    <!-- No skip link: the fragment is app state here, so a `#feed` href would
         clash with the `#q=…&note=…` deep links. The page is a single column
         with landmarks and headings to navigate by instead. -->
    <header class="site-header">
      <h1>Porto Notes</h1>
      <p class="tagline">A shared board for notes, links and plans.</p>
    </header>

    <main id="app">
      <section class="panel" aria-labelledby="compose-heading">
        <h2 id="compose-heading">Add a note</h2>
        <form id="note-form" novalidate>
          <div class="field">
            <label for="title">Title</label>
            <input id="title" name="title" type="text" autocomplete="off" />
          </div>

          <div class="field">
            <label for="body">Body</label>
            <textarea id="body" name="body" rows="4" aria-describedby="body-help"></textarea>
            <p id="body-help" class="help">
              Basic formatting:
              <code>&lt;b&gt;</code>, <code>&lt;i&gt;</code>,
              <code>&lt;a href="…"&gt;</code> and <code>&lt;br&gt;</code>. New lines are kept.
            </p>
          </div>

          <div class="field">
            <label for="avatar">Author avatar URL <span class="optional">(optional)</span></label>
            <input id="avatar" name="avatar" type="url" autocomplete="off" placeholder="https://…" />
          </div>

          <p id="form-error" class="error" role="alert"></p>
          <button type="submit" class="primary">Add note</button>
        </form>
      </section>

      <section class="panel" aria-labelledby="search-heading">
        <h2 id="search-heading">Search</h2>
        <div class="field">
          <label for="search">Search notes</label>
          <input id="search" name="search" type="search" autocomplete="off" placeholder="Search titles and bodies" />
        </div>
        <p id="results-line" role="status" aria-live="polite"></p>
      </section>

      <h2 id="feed-heading">Notes</h2>
      <p id="empty-state" class="empty" hidden></p>
      <section id="feed" aria-labelledby="feed-heading" tabindex="-1"></section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
